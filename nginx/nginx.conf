events {}

http {
    # mTLS/HTTPS для API (порт 443) и обычный HTTP для сайтов (порт 80).
    # ПРИМЕЧАНИЕ: mTLS терминуется на nginx (клиентские сертификаты проверяются
    # через verify_client), затем в backend уходит обычный HTTP на :8080.
    # Если backend сам читает TLS/mTLS — замените ssl_pass_through/прокси.
    # Здесь оставлен базовый reverse-proxy + раздача статики.

    # ---- Сайт-витрина и политика (HTTP) ----
    server {
        listen 80;
        server_name _;

        # Редирект на HTTPS (домен/Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Витрина + защищённая раздача приложений (HTTPS) ----
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # HTTP->static (lenindig)
        location /dist/ {
            root /var/www;
            index index.html;
        }
        location /privacy/ {
            root /var/www;
            index index.html;
        }
        location / {
            root /var/www/dist;
            index index.html;
        }

        # ---- База скачиваний: раздача установщиков (APK/exe) ----
        # Файлы лежат в /var/www/downloads/, доступ к списку — через API с авторизацией.
        location /downloads/ {
            root /var/www;
            alias /var/www/downloads/;
            add_header Content-Disposition 'attachment';
            default_type application/octet-stream;
        }
        location /api/apps {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}