events {}

http {
    # mTLS/HTTPS для API (порт 443) и обычный HTTP для сайтов (порт 80).
    # ПРИМЕЧАНИЕ: mTLS терминуется на nginx (клиентские сертификаты проверяются
    # через verify_client), затем в backend уходит обычный HTTP на :8080.
    # Если backend сам читает TLS/mTLS — замените ssl_pass_through/прокси.
    # Здесь оставлен базовый reverse-proxy + раздача статики.

    # ---- Сайт-витрина и политика (HTTP) ----
    server {
        listen 80;
        server_name _;

        location /dist/ {
            root /var/www;
            index index.html;
        }
        location /privacy/ {
            root /var/www;
            index index.html;
        }
        # корень -> витрина
        location / {
            root /var/www/dist;
            index index.html;
        }
    }

    # ---- API (HTTPS) ----
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # mTLS (если требуется клиентский сертификат):
        # ssl_verify_client on;
        # ssl_client_certificate /etc/nginx/ssl/ca_root.crt;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}