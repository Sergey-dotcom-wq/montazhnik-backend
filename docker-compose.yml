version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: montazhnik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: montazhnik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-montazhnik_pass}
      POSTGRES_DB: montazhnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montazhnik"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 5432 НЕ публикуем наружу — только внутри сети compose.

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: montazhnik-s3
    restart: unless-stopped
    command: server -s3 -s3.port=9000 -dir=/data -volume.port=9080 -master.port=9333
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: montazhnik-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://montazhnik:${POSTGRES_PASSWORD:-montazhnik_pass}@postgres:5432/montazhnik?sslmode=disable
      BIND_ADDR: 0.0.0.0
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: seaweedfs-s3:9000
      S3_BUCKET: ${S3_BUCKET:-montazhnik-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_TLS: "false"
      S3_RETENTION: ${S3_RETENTION:-7}
      S3_ENC_KEY: ${S3_ENC_KEY}
    volumes:
      # mTLS-ключи и статика сайтов монтируются с хоста.
      - ./pki:/app/pki:ro
    # 8080/8443 наружу не открываем напрямую — только через nginx.
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: montazhnik-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../dist-site:/var/www/dist:ro
      - ../../privacy-site:/var/www/privacy:ro
    command: nginx -g "daemon off;"

volumes:
  pgdata:
  s3data: